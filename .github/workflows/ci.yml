name: CI

on:
  push:
  pull_request:

jobs:
  repo-sanity:
    name: Repo sanity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Compile Python scripts
        run: |
          python -m py_compile \
            bench/analyze_jsonl.py \
            bench/run_ray_baseline.py \
            bench/run_hpx_python_baseline.py \
            bench/service_sequence.py \
            bench/smoke_diag.py \
            bench/smoke_local.py \
            bench/smoke_rayx.py \
            bench/smoke_service_sequence.py \
            examples/rayx_basic.py \
            experiments/06_diag_fifo_ceiling_analysis/run_diag_ceiling.py

      - name: Golden service-sequence check
        # Dependency-free (no Ray, no rayx): pins the shared deterministic
        # service sequence against frozen golden values so the Python drivers
        # and the native C++ service_for cannot drift silently.
        run: python bench/smoke_service_sequence.py

      - name: Check README links point to existing local files
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          readme = pathlib.Path("readme.md")
          text = readme.read_text()

          ok = True
          for target in re.findall(r"\[[^\]]+\]\(([^)]+)\)", text):
              if target.startswith(("http://", "https://", "#", "mailto:")):
                  continue
              path = pathlib.Path(target.split("#", 1)[0])
              if not path.exists():
                  print(f"Broken README link: {target}")
                  ok = False

          if not ok:
              sys.exit(1)
          PY

      - name: Check no raw artifacts are tracked
        run: |
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          forbidden_suffixes = (
              ".jsonl",
              ".summary.json",
              ".log",
              ".so",
          )

          bad = []
          for path in tracked:
              if path.startswith("results/"):
                  bad.append(path)
              if path.endswith(forbidden_suffixes):
                  bad.append(path)

          if bad:
              print("Forbidden tracked raw/build artifacts:")
              for path in bad:
                  print("  " + path)
              sys.exit(1)
          PY

      - name: Validate curated diag JSON shape
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          diag_dir = pathlib.Path("experiments/06_diag_fifo_ceiling_analysis/diag")
          if not diag_dir.exists():
              print("diag directory missing")
              sys.exit(1)

          files = sorted(diag_dir.glob("*.diag.json"))
          if len(files) != 9:
              print(f"Expected 9 diag files, found {len(files)}")
              sys.exit(1)

          required = {"schema", "phases_ms", "queue_depth_at_enqueue", "lanes"}
          for path in files:
              data = json.loads(path.read_text())
              missing = required - data.keys()
              if missing:
                  print(f"{path}: missing {sorted(missing)}")
                  sys.exit(1)
              if data["schema"] != "diag-1":
                  print(f"{path}: wrong schema {data['schema']!r}")
                  sys.exit(1)
              if not data["lanes"]:
                  print(f"{path}: lanes empty")
                  sys.exit(1)
              if "processed" not in data["lanes"][0]:
                  print(f"{path}: lane missing processed")
                  sys.exit(1)
          PY

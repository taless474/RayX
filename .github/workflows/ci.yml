name: CI

on:
  push:
  pull_request:

jobs:
  repo-sanity:
    name: Repo sanity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Compile Python scripts
        # Syntax-only: py_compile never imports, so this is safe without Ray, the
        # _rayx extension, or HPX. Globs auto-cover new bench helpers and every
        # experiment runner (experiments/NN_name/run_*.py) so the list cannot
        # drift. Experiment runners are COMPILED here but NEVER run in CI -- they
        # need _rayx + HPX and some are timing-sensitive (run them locally). The
        # rayx Python facade (python/src/rayx/*.py) and the rayx.runtime subpackage
        # (python/src/rayx/runtime/*.py) are included too; py_compile parses them
        # without importing, so their _rayx/HPX-only import path is never triggered.
        # The test suites (tests/unit, tests/integration) are compiled here for
        # syntax coverage; only tests/unit is RUN in this job (see below) -- the
        # integration tests need _rayx and run in native-rayx-smoke.yml.
        run: python -m py_compile bench/*.py examples/*.py ray_impl/*.py experiments/*/run_*.py benchmarks/*/run_*.py python/src/rayx/*.py python/src/rayx/runtime/*.py tests/unit/*.py tests/integration/*.py

      - name: Install dev test dependencies
        # pytest only (requirements-dev.txt). Pure-Python, fast; this job does NOT
        # build _rayx / HPX, so it runs only the import-light unit tests below.
        run: python -m pip install -r requirements-dev.txt

      - name: Run rayx.runtime pure unit tests
        # tests/unit is import-light: it loads rayx/runtime/_validate.py and
        # _errors.py by FILE PATH and never imports rayx / rayx.runtime / _rayx, so
        # it is safe in this no-extension job. The integration tests and the runtime
        # smoke are NOT run here -- they need _rayx (see native-rayx-smoke.yml).
        run: pytest tests/unit

      - name: Golden service-sequence check
        # Dependency-free (no Ray, no rayx): pins the shared deterministic
        # service sequence against frozen golden values so the Python drivers
        # and the native C++ service_for cannot drift silently.
        run: python bench/smoke_service_sequence.py

      - name: Check local markdown links and image sources resolve
        # Repo-integrity only: every relative ](path) markdown link AND every
        # local HTML <img src="path"> (e.g. the README logo) in README, CLAUDE.md,
        # and all docs/benchmarks/experiments markdown must point at an existing
        # file, resolved RELATIVE TO THE LINKING FILE. Skips http(s)/mailto and
        # pure #anchors. Fetches nothing.
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          roots = [pathlib.Path("readme.md"), pathlib.Path("CLAUDE.md")]
          for d in ("docs", "benchmarks", "experiments"):
              roots += sorted(pathlib.Path(d).rglob("*.md"))

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          img_re = re.compile(r"""<img\b[^>]*?\bsrc=["']([^"']+)["']""", re.IGNORECASE)

          ok = True
          checked = 0
          for md in roots:
              if not md.exists():
                  continue
              base = md.parent
              text = md.read_text()
              targets = ([("link", t) for t in link_re.findall(text)]
                         + [("image", t) for t in img_re.findall(text)])
              for kind, target in targets:
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  rel = target.split("#", 1)[0]
                  if not rel:
                      continue
                  checked += 1
                  if not (base / rel).exists():
                      print(f"Broken {kind} in {md}: {target}")
                      ok = False

          if not ok:
              sys.exit(1)
          print(f"OK: {checked} local markdown links/images resolve")
          PY

      - name: Curated aggregate JSON must stay tracked-eligible and valid
        # Recognizes ANY *aggregate*.json (not just files named exactly
        # aggregate.json), so the exp58/59/60 evidence arc (perf_aggregate_*.json,
        # ray_actor_aggregate.json, ray_vs_hpx_plane_labeled_aggregate.json,
        # hpx_same_node_control_aggregate.json, ...) is covered. Two guarantees,
        # no benchmark rerun and no timing assertions:
        #   (1) canonical files named exactly aggregate.json must NEVER be ignored
        #       (the original .gitignore ! re-include can't silently break);
        #   (2) every TRACKABLE (curated, not git-ignored) *aggregate*.json must be
        #       valid JSON. Intentionally-ignored siblings (skip/fail/redirected,
        #       deprecated names) are raw scratch and are skipped, not validated.
        # Skip-clean: if no such files exist (e.g. evidence dirs not yet committed)
        # the check passes trivially.
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          files = sorted(
              str(p)
              for d in ("benchmarks", "experiments")
              for p in pathlib.Path(d).rglob("*aggregate*.json")
          )
          if not files:
              print("No *aggregate*.json found to check")
              sys.exit(0)

          ignored = set(subprocess.run(
              ["git", "check-ignore", *files],
              capture_output=True, text=True
          ).stdout.split())

          # (1) exact-name aggregate.json must stay tracked-eligible
          exact = [f for f in files if pathlib.Path(f).name == "aggregate.json"]
          wrongly_ignored = [f for f in exact if f in ignored]
          if wrongly_ignored:
              print("Curated aggregate.json wrongly ignored by .gitignore:")
              for f in wrongly_ignored:
                  print("  " + f)
              sys.exit(1)

          # (2) every curated (not-ignored) *aggregate*.json must be valid JSON
          curated = [f for f in files if f not in ignored]
          bad = []
          for f in curated:
              try:
                  json.loads(pathlib.Path(f).read_text())
              except (OSError, ValueError) as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Curated aggregate JSON is not valid JSON:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)

          print(f"OK: {len(exact)} exact aggregate.json tracked-eligible; "
                f"{len(curated)} curated *aggregate*.json valid JSON")
          PY

      - name: Check no raw artifacts are tracked
        run: |
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          forbidden_suffixes = (
              ".jsonl",
              ".summary.json",
              ".log",
              ".so",
              ".dylib",
              ".o",
              ".a",
              ".pyc",
          )

          # Raw per-run / build / log directories must never be tracked, including
          # extension-less contents (e.g. a compiled binary under build/, or a
          # run_aggregate.json under _control_runs/). Matched as a path segment so
          # both "build/x" (root) and "experiments/NN/build/x" are caught; curated
          # top-level *aggregate*.json (which live in the experiment dir, NOT under
          # these dirs) are unaffected.
          forbidden_dir_segments = (
              "/_ray_runs/",
              "/_control_runs/",
              "/_perf_runs/",
              "/build/",
              "/logs/",
          )

          bad = set()
          for path in tracked:
              if path.startswith("results/"):
                  bad.add(path)
              if "__pycache__/" in path or path.endswith("__pycache__"):
                  bad.add(path)
              if ".dSYM/" in path or path.endswith(".dSYM"):
                  bad.add(path)
              if path.endswith(forbidden_suffixes):
                  bad.add(path)
              if any(seg in f"/{path}" for seg in forbidden_dir_segments):
                  bad.add(path)

          if bad:
              print("Forbidden tracked raw/build artifacts:")
              for path in sorted(bad):
                  print("  " + path)
              sys.exit(1)
          PY

      - name: Validate curated diag JSON shape
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          diag_dir = pathlib.Path("experiments/06_diag_fifo_ceiling_analysis/diag")
          if not diag_dir.exists():
              print("diag directory missing")
              sys.exit(1)

          files = sorted(diag_dir.glob("*.diag.json"))
          if len(files) != 9:
              print(f"Expected 9 diag files, found {len(files)}")
              sys.exit(1)

          required = {"schema", "phases_ms", "queue_depth_at_enqueue", "lanes"}
          for path in files:
              data = json.loads(path.read_text())
              missing = required - data.keys()
              if missing:
                  print(f"{path}: missing {sorted(missing)}")
                  sys.exit(1)
              if data["schema"] != "diag-1":
                  print(f"{path}: wrong schema {data['schema']!r}")
                  sys.exit(1)
              if not data["lanes"]:
                  print(f"{path}: lanes empty")
                  sys.exit(1)
              if "processed" not in data["lanes"][0]:
                  print(f"{path}: lane missing processed")
                  sys.exit(1)
          PY

      - name: Claim-fence guard (exp59 Slice 5 + exp60, skip-clean)
        # Pure-Python structural guard over the curated comparison/control JSON.
        # Protects the claim FENCES (boolean policy flags + provenance presence)
        # from silent drift -- it never reads/asserts p50/p99 timing numbers, never
        # reruns a benchmark, and skips cleanly if a file is absent (the evidence
        # dirs may not be committed yet). It does NOT pin exp60 overall/r_count/
        # is_full_band (run-specific), only durable policy flags + gate presence.
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          failures = []

          def load(path):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"skip (absent): {path}")
                  return None
              try:
                  return json.loads(p.read_text())
              except (OSError, ValueError) as e:
                  failures.append(f"{path}: not valid JSON: {e}")
                  return None

          def want(path, d, key, expected):
              if d.get(key) is not expected:
                  failures.append(f"{path}: {key} must be {expected}, got {d.get(key)!r}")

          slice5 = "experiments/59_ray_actor_vs_hpx_action_path/ray_vs_hpx_plane_labeled_aggregate.json"
          d = load(slice5)
          if d is not None:
              for k in ("same_axis_comparison", "speedup_computed", "ratio_reported",
                        "verdict_allowed", "perf_claim_allowed"):
                  want(slice5, d, k, False)
              if not (d.get("qd1_only") is True
                      or d.get("pipeline_excluded_from_comparison") is True):
                  failures.append(f"{slice5}: expected qd1_only==true OR "
                                  "pipeline_excluded_from_comparison==true")
              sa = d.get("source_artifacts")
              if not (isinstance(sa, list) and sa):
                  failures.append(f"{slice5}: source_artifacts must be a non-empty list")

          exp60 = "experiments/60_hpx_same_node_locality_control/hpx_same_node_control_aggregate.json"
          d = load(exp60)
          if d is not None:
              want(exp60, d, "is_within_hpx_decomposition", True)
              want(exp60, d, "is_ray_vs_hpx_comparison", False)
              want(exp60, d, "perf_claim_allowed", False)
              gates = d.get("gates") or {}
              if "every_island_no_orphans" not in gates:
                  failures.append(f"{exp60}: gates missing 'every_island_no_orphans'")

          if failures:
              print("Claim-fence guard failures:")
              for f in failures:
                  print("  " + f)
              sys.exit(1)
          print("OK: claim-fence guard passed (absent files skipped)")
          PY

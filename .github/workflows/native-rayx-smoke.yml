name: Native RayX smoke

# Heavy native path: builds HPX from source (pinned v1.11.0), builds the native
# HPX baseline and the rayx pybind extension, and runs the --diag smoke, the
# rayx API contract smoke, and a tiny rayx driver retire-mode smoke (one_by_one
# + batch_wait, analyzer-checked). Separate from the lightweight ci.yml (which
# does only static/structural checks and never builds HPX). The HPX install
# prefix is cached, so the slow from-source build is paid once per cache key.
#
# Runs on every push to main (current development happens directly on main) and
# on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run if a newer commit is pushed.
concurrency:
  group: native-rayx-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HPX_TAG: v1.11.0
  HPX_PREFIX: ${{ github.workspace }}/hpx-install
  HPX_SRC: ${{ github.workspace }}/hpx-src

jobs:
  native-rayx-smoke:
    name: Build HPX + RayX and smoke
    # Pinned (not ubuntu-latest) so the cached HPX prefix is never restored under
    # a different image/toolchain after GitHub moves the latest alias.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            libboost-all-dev \
            libhwloc-dev

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip pybind11

      # Diagnostic only (no behavior change): surfaces the exact toolchain this
      # cross-version (Python 3.12 / Linux) run uses, so build/link failures are
      # easy to triage.
      - name: Toolchain versions
        run: |
          python --version
          which python
          cmake --version
          ninja --version
          python -m pybind11 --cmakedir

      # The install prefix is the only durable HPX artifact RayX consumes. Cache
      # it keyed on the pinned runner image + arch + pinned tag + the configure
      # flags, so an image/toolchain, tag, or flag change busts the cache. The
      # HPX build/install steps below are skipped on a cache hit.
      - name: Cache HPX install prefix
        id: cache-hpx
        uses: actions/cache@v4
        with:
          path: ${{ env.HPX_PREFIX }}
          key: hpx-ubuntu-24.04-${{ runner.arch }}-${{ env.HPX_TAG }}-fetchasio-mallocsystem-noexamples-notests-nodocs-v1

      - name: Fetch HPX source (pinned)
        if: steps.cache-hpx.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${HPX_TAG}" \
            https://github.com/STEllAR-GROUP/hpx.git "${HPX_SRC}"

      - name: Configure HPX
        if: steps.cache-hpx.outputs.cache-hit != 'true'
        run: |
          cmake -S "${HPX_SRC}" -B "${HPX_SRC}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${HPX_PREFIX}" \
            -DHPX_WITH_FETCH_ASIO=ON \
            -DHPX_WITH_MALLOC=system \
            -DHPX_WITH_EXAMPLES=OFF \
            -DHPX_WITH_TESTS=OFF \
            -DHPX_WITH_DOCUMENTATION=OFF

      - name: Build and install HPX
        if: steps.cache-hpx.outputs.cache-hit != 'true'
        # Cap parallelism: HPX is template-heavy and can OOM a 16 GB runner at
        # full -j. Tune up later once the cold build is known-green.
        run: |
          cmake --build "${HPX_SRC}/build" --parallel 3
          cmake --install "${HPX_SRC}/build"

      - name: Build native HPX baseline (hpx_impl)
        run: |
          cmake -S hpx_impl -B hpx_impl/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${HPX_PREFIX}"
          cmake --build hpx_impl/build

      - name: Run --diag smoke
        run: python bench/smoke_diag.py

      - name: Build rayx pybind extension (python)
        run: |
          cmake -S python -B python/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYBIND11_FINDPYTHON=ON \
            -DCMAKE_PREFIX_PATH="${HPX_PREFIX};$(python -m pybind11 --cmakedir)" \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build python/build

      - name: Run rayx smoke
        run: python bench/smoke_rayx.py

      - name: Run rayx driver retire-mode smoke (one_by_one + batch_wait)
        # Exercises the Python driver's FIFO (one_by_one) and as-completed
        # (batch_wait, via Engine.wait) retire loops end to end, and checks the
        # analyzer rolls up each output. Tiny no-op cell -- a path/contract
        # check, NOT a performance run. Scratch JSONL goes under results/
        # (gitignored).
        run: |
          python bench/run_hpx_python_baseline.py --api engine \
            --num-lanes 2 --hpx-threads 4 --requests 40 --warmup-requests 5 \
            --service-ms 0 --retire-mode one_by_one --out results/ci_obo.jsonl
          python bench/run_hpx_python_baseline.py --api engine \
            --num-lanes 2 --hpx-threads 4 --requests 40 --warmup-requests 5 \
            --service-ms 0 --retire-mode batch_wait --wait-batch 2 \
            --out results/ci_bw.jsonl
          python bench/analyze_jsonl.py results/ci_obo.jsonl
          python bench/analyze_jsonl.py results/ci_bw.jsonl

      - name: Native golden service-sequence check
        # The native C++ service_for is a hand-mirrored copy of the shared
        # Python helper (bench/service_sequence.py, golden-pinned in ci.yml).
        # Run a tiny bimodal seed=0 cell and assert the emitted
        # service_ms_requested matches the golden anchors (idx 0/1/3 = 20/1/20)
        # so the C++ copy cannot drift from the Python sequence.
        run: |
          hpx_impl/build/hpx_synthetic_baseline \
            --service-pattern bimodal --service-low 1 --service-high 20 \
            --service-p-high 0.1 --seed 0 --work-mode sleep \
            --requests 8 --num-lanes 1 --out results/ci_golden_native.jsonl
          python - <<'PY'
          import json
          rows = sorted((json.loads(l) for l in open("results/ci_golden_native.jsonl")),
                        key=lambda r: r["request_id"])
          seq = [r["service_ms_requested"] for r in rows]
          golden = [20, 1, 1, 20, 1, 1, 1, 1]
          assert seq == golden, f"native sequence {seq} != golden {golden}"
          print("OK: native service_for matches golden", seq)
          PY
